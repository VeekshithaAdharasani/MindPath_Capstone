<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f24" />
      <stop offset="100%" stop-color="#060812" />
    </linearGradient>
    <linearGradient id="bubbleAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d3f" />
      <stop offset="100%" stop-color="#12152e" />
    </linearGradient>
    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="aiBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="24" fill="url(#bgGrad2)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#111636" rx="24" />
  <rect x="0" y="24" width="800" height="18" fill="#111636" />
  <line x1="0" y1="42" x2="800" y2="42" stroke="#ffffff" stroke-opacity="0.08" />
  
  <circle cx="28" cy="21" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="44" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8" />

  <text x="400" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
    MindPath AI Companion • 24/7 Intelligent Mentor &amp; Real-Time Search
  </text>

  <!-- Chat Drawer Header Strip -->
  <g transform="translate(32, 58)">
    <rect width="736" height="54" rx="14" fill="#141838" stroke="#ffffff" stroke-opacity="0.08" />
    
    <!-- AI Avatar Badge -->
    <circle cx="36" cy="27" r="16" fill="url(#aiBadge)" filter="url(#glow2)"/>
    <circle cx="36" cy="27" r="14" fill="#0f172a" />
    <path d="M 30 27 L 42 27 M 36 21 L 36 33" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <text x="64" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      MindPath Companion
    </text>
    <text x="64" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">
      Personalized mentor &amp; career advisor • MindPath Neural Core
    </text>

    <!-- Active Tool Pills -->
    <g transform="translate(420, 16)">
      <rect width="105" height="22" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
      <text x="52" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#67e8f9">
        🌐 Live Search: ON
      </text>

      <rect x="115" width="80" height="22" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4"/>
      <text x="155" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#c084fc">
        ⚡ Solver
      </text>

      <rect x="205" width="95" height="22" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="252" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">
        ● Live Active
      </text>
    </g>
  </g>

  <!-- Message 1: User Question -->
  <g transform="translate(190, 126)">
    <rect width="578" height="52" rx="14" fill="url(#bubbleUser)" />
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
      What are the latest 2026 AI Engineer placement trends and required math prerequisites?
    </text>
    <text x="20" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#e0e7ff" opacity="0.8">
      Include salary ranges and recommended projects for freshers.
    </text>
  </g>

  <!-- Real-Time Tool Execution Chip -->
  <g transform="translate(32, 190)">
    <rect width="520" height="28" rx="8" fill="#083344" stroke="#06b6d4" stroke-opacity="0.4" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8" />
    <text x="28" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">
      Tool Executed: Live Web Search (4 Verified 2026 Tech Industry Sources)
    </text>
  </g>

  <!-- Message 2: AI Response with Markdown & Badges -->
  <g transform="translate(32, 228)">
    <rect width="736" height="195" rx="16" fill="url(#bubbleAi)" stroke="#ffffff" stroke-opacity="0.08" />

    <!-- AI Header -->
    <circle cx="28" cy="24" r="10" fill="url(#aiBadge)" />
    <text x="46" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">MindPath AI</text>
    <text x="126" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">Verified Citations Included</text>

    <!-- Response Body -->
    <text x="28" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
      🚀 2026 AI Engineer Market Projections &amp; Placement Trajectory:
    </text>
    <text x="28" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">
      • <tspan font-weight="700" fill="#ffffff">Compensation Benchmark:</tspan> Entry-level AI engineers are commanding <tspan fill="#34d399" font-weight="700">₹14L – ₹32L</tspan> in leading tech hubs.
    </text>
    <text x="28" y="102" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">
      • <tspan font-weight="700" fill="#ffffff">Core Mathematics:</tspan> Multivariable calculus (gradients, chain rule), Linear Algebra (eigenvalues), and Probability.
    </text>
    <text x="28" y="124" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">
      • <tspan font-weight="700" fill="#ffffff">High-Impact Project:</tspan> Build a local RAG agent with PyTorch and embed quantized weights.
    </text>

    <!-- Citation Pills -->
    <g transform="translate(28, 145)">
      <rect width="180" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="12" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">
        🔗 TechCareers 2026 Report
      </text>

      <rect x="190" width="180" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="202" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">
        🔗 IEEE AI Salary Survey
      </text>

      <rect x="380" width="170" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="392" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">
        🔗 arXiv Transformer Prep
      </text>
    </g>
  </g>

  <!-- Input Bar Preview -->
  <g transform="translate(32, 436)">
    <rect width="736" height="46" rx="14" fill="#141838" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#64748b">
      Ask anything... (math solver, syllabus lookup, schedule advice)
    </text>
    <rect x="680" y="8" width="46" height="30" rx="8" fill="url(#bubbleUser)" />
    <path d="M 698 23 L 708 23 M 704 19 L 708 23 L 704 27" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>

