<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#080a14" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151a3d" />
      <stop offset="100%" stop-color="#0f1228" />
    </linearGradient>
    <linearGradient id="simGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgGrad3)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#111636" rx="24" />
  <rect x="0" y="24" width="800" height="18" fill="#111636" />
  <line x1="0" y1="42" x2="800" y2="42" stroke="#ffffff" stroke-opacity="0.08" />
  
  <circle cx="28" cy="21" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="44" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8" />

  <text x="400" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
    Career Explorer • Market Intel &amp; What-If Scenario Modeler
  </text>

  <!-- Hero Strip -->
  <g transform="translate(32, 60)">
    <rect width="736" height="74" rx="14" fill="url(#cardGrad3)" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">
      Discover High-Impact 2026 Tech &amp; Science Careers
    </text>
    <text x="24" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
      Explore market demand, verify verified compensation ranges, and simulate your career fit.
    </text>
    <g transform="translate(580, 20)">
      <rect width="130" height="34" rx="10" fill="url(#simGrad)" />
      <text x="65" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
        ✨ What-If Analysis
      </text>
    </g>
  </g>

  <!-- 3 Match Cards Grid -->
  <g transform="translate(32, 148)">
    <!-- Card 1: Data Scientist -->
    <rect width="234" height="175" rx="16" fill="url(#cardGrad3)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <g transform="translate(18, 18)">
      <rect width="36" height="36" rx="10" fill="#10b981" fill-opacity="0.2" />
      <text x="18" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">📊</text>
      <text x="46" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Data Scientist</text>
      <text x="46" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">98% Match</text>
      <text x="0" y="70" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">₹8L – ₹25L</text>
      <text x="0" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">Annual Package Range</text>
      <text x="0" y="112" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">
        Predictive modeling, analytics &amp; ML workflow automation.
      </text>
      <rect y="125" width="198" height="26" rx="8" fill="#1e293b" />
      <text x="99" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Simulate Fit →</text>
    </g>

    <!-- Card 2: AI / ML Engineer (Highlighted) -->
    <g transform="translate(251, 0)">
      <rect width="234" height="175" rx="16" fill="url(#cardGrad3)" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="2" filter="url(#glow3)"/>
      <g transform="translate(18, 18)">
        <rect width="36" height="36" rx="10" fill="#8b5cf6" fill-opacity="0.2" />
        <text x="18" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🧠</text>
        <text x="46" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">AI / ML Engineer</text>
        <text x="46" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#a855f7">95% Match</text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">₹10L – ₹40L</text>
        <text x="0" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">Annual Package Range</text>
        <text x="0" y="112" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">
          Large language models, deep neural nets &amp; agents.
        </text>
        <rect y="125" width="198" height="26" rx="8" fill="url(#simGrad)" />
        <text x="99" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Top Pick • Simulate →</text>
      </g>
    </g>

    <!-- Card 3: Cyber Security -->
    <g transform="translate(502, 0)">
      <rect width="234" height="175" rx="16" fill="url(#cardGrad3)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <g transform="translate(18, 18)">
        <rect width="36" height="36" rx="10" fill="#06b6d4" fill-opacity="0.2" />
        <text x="18" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🛡️</text>
        <text x="46" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Cyber Security</text>
        <text x="46" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">91% Match</text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">₹6L – ₹22L</text>
        <text x="0" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">Annual Package Range</text>
        <text x="0" y="112" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">
          Cloud defenses, pentesting &amp; crypto protocols.
        </text>
        <rect y="125" width="198" height="26" rx="8" fill="#1e293b" />
        <text x="99" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Simulate Fit →</text>
      </g>
    </g>
  </g>

  <!-- Interactive What-If Scenario Tray -->
  <g transform="translate(32, 336)">
    <rect width="736" height="138" rx="16" fill="#121636" stroke="#8b5cf6" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <text x="24" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">
      ⚡ Live Scenario Simulation: "If I complete Python + PyTorch certification in next 4 months"
    </text>
    
    <!-- Simulation KPIs -->
    <g transform="translate(24, 46)">
      <!-- KPI 1 -->
      <rect width="216" height="70" rx="12" fill="#1a1f44" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Projected Career Match</text>
      <text x="16" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#34d399">95% → 99%</text>

      <!-- KPI 2 -->
      <g transform="translate(232, 0)">
        <rect width="216" height="70" rx="12" fill="#1a1f44" />
        <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Starting CTC Projection</text>
        <text x="16" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#38bdf8">₹12L → ₹22L+</text>
      </g>

      <!-- KPI 3 -->
      <g transform="translate(464, 0)">
        <rect width="224" height="70" rx="12" fill="#1a1f44" />
        <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Job Placement Ready In</text>
        <text x="16" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#a78bfa">6 Months</text>
      </g>
    </g>
  </g>
</svg>

