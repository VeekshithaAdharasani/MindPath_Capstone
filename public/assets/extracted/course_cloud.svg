<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101c"/>
      <stop offset="50%" stop-color="#0a1d33"/>
      <stop offset="100%" stop-color="#040b14"/>
    </linearGradient>

    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="emeraldTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <radialGradient id="cloudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="cloudNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="cloudGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#cloudBg)"/>
  <rect width="1600" height="900" fill="url(#cloudGrid)"/>
  <circle cx="800" cy="450" r="500" fill="url(#cloudGlow)"/>

  <!-- DevOps Infinity Loop (CI/CD Pipeline) -->
  <g transform="translate(800, 450)" filter="url(#cloudNeon)">
    <path d="M -160 0 C -160 -120 -40 -120 0 0 C 40 120 160 120 160 0 C 160 -120 40 -120 0 0 C -40 120 -160 120 -160 0 Z" fill="none" stroke="url(#skyGrad)" stroke-width="8" stroke-dasharray="16 8"/>

    <!-- Central Cloud Mesh Silhouette -->
    <path d="M -100 -20 C -100 -80 -40 -100 0 -100 C 40 -100 80 -70 90 -40 C 130 -40 160 -10 160 30 C 160 70 120 100 80 100 H -90 C -130 100 -160 70 -160 30 C -160 -10 -130 -40 -100 -40 Z" fill="rgba(56, 189, 248, 0.12)" stroke="url(#emeraldTealGrad)" stroke-width="3"/>
  </g>

  <!-- 3D Isometric Container Blocks -->
  <g transform="translate(420, 360)" filter="url(#cloudNeon)">
    <!-- Cube Left -->
    <polygon points="0,40 50,15 100,40 50,65" fill="#38bdf8"/>
    <polygon points="0,40 50,65 50,120 0,95" fill="#0284c7"/>
    <polygon points="50,65 100,40 100,95 50,120" fill="#0369a1"/>
  </g>

  <g transform="translate(1080, 360)" filter="url(#cloudNeon)">
    <!-- Cube Right -->
    <polygon points="0,40 50,15 100,40 50,65" fill="#10b981"/>
    <polygon points="0,40 50,65 50,120 0,95" fill="#059669"/>
    <polygon points="50,65 100,40 100,95 50,120" fill="#047857"/>
  </g>

  <!-- Flowing Network Fibers -->
  <g stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" fill="none">
    <path d="M 200 650 C 350 550 500 550 650 650"/>
    <path d="M 950 650 C 1100 550 1250 550 1400 650"/>
  </g>

  <!-- Ambient Particles -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="280" cy="240" r="3"/>
    <circle cx="450" cy="680" r="3.5"/>
    <circle cx="1200" cy="220" r="2.5"/>
    <circle cx="1320" cy="620" r="4"/>
  </g>
</svg>

