<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="mathBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c1e"/>
      <stop offset="50%" stop-color="#0f1638"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="mathBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <radialGradient id="mathGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="mathNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="mathGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#mathBg)"/>
  <rect width="1600" height="900" fill="url(#mathGrid)"/>
  <circle cx="800" cy="450" r="500" fill="url(#mathGlow)"/>

  <!-- Geometric Golden Triangle & Circle Inscription -->
  <g transform="translate(800, 450)" filter="url(#mathNeon)">
    <!-- Outer Inscribed Circle -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="16 8"/>

    <!-- Sacred Triangle -->
    <polygon points="0,-220 190,110 -190,110" fill="rgba(99, 102, 241, 0.08)" stroke="url(#mathBlueGrad)" stroke-width="4"/>

    <!-- Sigma Σ Symbol Center -->
    <path d="M 50 -70 H -30 L 15 0 L -30 70 H 50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Integral & Pi Float Symbols -->
  <g stroke="rgba(56, 189, 248, 0.4)" stroke-width="5" fill="none" stroke-linecap="round">
    <!-- Left Integral ∫ -->
    <path d="M 380 520 C 350 520 340 500 340 460 V 380 C 340 340 330 320 300 320"/>
    <!-- Right Pi π -->
    <path d="M 1240 380 H 1320 M 1260 380 V 460 M 1300 380 V 460 C 1300 480 1315 480 1325 470"/>
  </g>

  <!-- Ambient Light Sparks -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="280" cy="220" r="3"/>
    <circle cx="450" cy="740" r="3.5"/>
    <circle cx="1250" cy="240" r="2.5"/>
    <circle cx="1380" cy="620" r="4"/>
  </g>
</svg>

