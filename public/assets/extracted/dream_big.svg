<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080a14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090a12"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="300" height="400" rx="20" fill="url(#nebula)"/>

  <!-- Celestial Constellations / Stars -->
  <circle cx="45" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="85" cy="80" r="2" fill="#38bdf8" filter="url(#starGlow)"/>
  <circle cx="150" cy="40" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="230" cy="65" r="2.5" fill="#f43f5e" filter="url(#starGlow)"/>
  <circle cx="260" cy="110" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="120" cy="120" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="190" cy="140" r="2" fill="#a855f7" filter="url(#starGlow)"/>
  <circle cx="60" cy="160" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="240" cy="180" r="1.5" fill="#38bdf8"/>

  <!-- Glowing Northern Light Arc -->
  <path d="M -20 180 Q 80 90, 160 130 T 320 110 L 320 220 L -20 220 Z" fill="url(#aurora)" opacity="0.35"/>
  <path d="M -20 150 Q 120 70, 220 120 T 320 80" stroke="#38bdf8" stroke-width="2" opacity="0.4" fill="none"/>

  <!-- Majestic Mountains Silhouette -->
  <polygon points="-10,320 70,220 140,290 220,190 310,310 310,400 -10,400" fill="url(#mountainGrad)"/>
  <polygon points="120,330 180,240 250,330" fill="#131427" opacity="0.7"/>
  
  <!-- Glowing Horizon Rim -->
  <path d="M 70 220 L 140 290 L 220 190 L 280 270" stroke="#8b5cf6" stroke-width="2" opacity="0.5" fill="none"/>

  <!-- Lone Explorer on the Summit -->
  <circle cx="220" cy="174" r="3.5" fill="#ffffff"/>
  <path d="M 218 178 L 222 178 L 223 188 L 217 188 Z" fill="#ffffff"/>
  <line x1="223" y1="180" x2="225" y2="189" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Cosmic Beacon Star emitting above Explorer -->
  <circle cx="220" cy="155" r="3" fill="#38bdf8" filter="url(#starGlow)"/>
  <line x1="220" y1="145" x2="220" y2="165" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  <line x1="210" y1="155" x2="230" y2="155" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

  <!-- Bottom Gradient Shield for Text Readability -->
  <rect y="260" width="300" height="140" rx="20" fill="url(#nebula)" opacity="0.85"/>
  <rect y="280" width="300" height="120" fill="url(#mountainGrad)" opacity="0.9"/>

  <!-- Native SVG Crisp Typography -->
  <text x="150" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="3" fill="url(#textGlow)">
    DREAM BIG
  </text>
  <text x="150" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8" letter-spacing="0.5">
    Your AI Companion is here to guide you
  </text>

  <!-- Pulsing Action Button Pill -->
  <g transform="translate(100, 372)">
    <rect width="100" height="18" rx="9" fill="#8b5cf6" opacity="0.25"/>
    <rect width="100" height="18" rx="9" stroke="#a855f7" stroke-width="1" fill="none"/>
    <text x="50" y="12" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#e9d5ff" letter-spacing="1">
      START NOW →
    </text>
  </g>
</svg>

