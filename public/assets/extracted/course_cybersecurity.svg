<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e1a"/>
      <stop offset="50%" stop-color="#0c192e"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="cyberNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="cyberHex" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 17 L 60 43 L 30 60 L 0 43 L 0 17 Z" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#cyberBg)"/>
  <rect width="1600" height="900" fill="url(#cyberHex)"/>
  <circle cx="800" cy="450" r="500" fill="url(#cyberGlow)"/>

  <!-- Concentric Defense Radar Rings -->
  <g stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" fill="none">
    <circle cx="800" cy="450" r="380" stroke-dasharray="16 12"/>
    <circle cx="800" cy="450" r="280" stroke-dasharray="8 8"/>
    <circle cx="800" cy="450" r="180"/>
  </g>

  <!-- 3D Cyber Defense Shield -->
  <g transform="translate(800, 450)" filter="url(#cyberNeon)">
    <!-- Outer Crest -->
    <path d="M 0 -180 L 140 -120 V 40 C 140 130 60 200 0 230 C -60 200 -140 130 -140 40 V -120 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="8"/>
    <path d="M 0 -150 L 115 -100 V 35 C 115 110 50 168 0 195 C -50 168 -115 110 -115 35 V -100 Z" fill="rgba(56, 189, 248, 0.08)"/>

    <!-- Center Holographic Padlock -->
    <rect x="-45" y="-10" width="90" height="80" rx="16" fill="url(#shieldGrad)"/>
    <path d="M -30 -10 V -45 C -30 -65 -15 -80 0 -80 C 15 -80 30 -65 30 -45 V -10" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="24" r="8" fill="#070e1a"/>
    <path d="M 0 32 V 46" stroke="#070e1a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Laser Grid Scan Lines -->
  <line x1="200" y1="450" x2="600" y2="450" stroke="rgba(244, 63, 94, 0.5)" stroke-width="2"/>
  <circle cx="200" cy="450" r="5" fill="#f43f5e"/>
  <circle cx="600" cy="450" r="5" fill="#f43f5e"/>

  <line x1="1000" y1="450" x2="1400" y2="450" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2"/>
  <circle cx="1000" cy="450" r="5" fill="#38bdf8"/>
  <circle cx="1400" cy="450" r="5" fill="#38bdf8"/>

  <!-- Floating Binary Data Particles -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="340" cy="220" r="3"/>
    <circle cx="480" cy="720" r="3.5"/>
    <circle cx="1220" cy="280" r="3"/>
    <circle cx="1350" cy="680" r="3.5"/>
  </g>
</svg>

