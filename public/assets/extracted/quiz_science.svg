<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041212"/>
      <stop offset="50%" stop-color="#082220"/>
      <stop offset="100%" stop-color="#020d0c"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <radialGradient id="sciGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <filter id="sciNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="sciGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sciBg)"/>
  <rect width="1600" height="900" fill="url(#sciGrid)"/>
  <circle cx="800" cy="450" r="500" fill="url(#sciGlow)"/>

  <!-- Science Atom Orbital Rings -->
  <g transform="translate(800, 450)" filter="url(#sciNeon)">
    <circle cx="0" cy="0" r="28" fill="#10b981"/>

    <ellipse cx="0" cy="0" rx="300" ry="110" fill="none" stroke="url(#emeraldGrad)" stroke-width="4"/>
    <g transform="rotate(60)">
      <ellipse cx="0" cy="0" rx="300" ry="110" fill="none" stroke="url(#emeraldGrad)" stroke-width="4"/>
    </g>
    <g transform="rotate(-60)">
      <ellipse cx="0" cy="0" rx="300" ry="110" fill="none" stroke="url(#emeraldGrad)" stroke-width="4"/>
    </g>

    <!-- Electrons -->
    <circle cx="260" cy="50" r="10" fill="#ffffff"/>
    <g transform="rotate(60)">
      <circle cx="-260" cy="-50" r="10" fill="#67e8f9"/>
    </g>
    <g transform="rotate(-60)">
      <circle cx="180" cy="80" r="10" fill="#a7f3d0"/>
    </g>
  </g>

  <!-- Ambient Particles -->
  <g fill="#10b981" opacity="0.6">
    <circle cx="320" cy="240" r="3"/>
    <circle cx="480" cy="680" r="3.5"/>
    <circle cx="1220" cy="260" r="2.5"/>
    <circle cx="1340" cy="640" r="4"/>
  </g>
</svg>

