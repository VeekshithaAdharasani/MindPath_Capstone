<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1f"/>
      <stop offset="50%" stop-color="#101432"/>
      <stop offset="100%" stop-color="#070914"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#techGrid)"/>

  <!-- Ambient Glows -->
  <circle cx="700" cy="450" r="450" fill="url(#glowCyan)"/>
  <circle cx="950" cy="450" r="420" fill="url(#glowGold)"/>

  <!-- Circuit Traces & Highway Lines -->
  <g stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" fill="none">
    <path d="M 100 200 H 450 L 550 300 H 750"/>
    <circle cx="100" cy="200" r="4" fill="#38bdf8"/>
    <circle cx="750" cy="300" r="4" fill="#38bdf8"/>

    <path d="M 1500 700 H 1150 L 1050 600 H 850" stroke="rgba(245, 158, 11, 0.25)"/>
    <circle cx="1500" cy="700" r="4" fill="#f59e0b"/>
    <circle cx="850" cy="600" r="4" fill="#f59e0b"/>

    <path d="M 200 750 L 400 550 H 600" stroke="rgba(129, 140, 248, 0.2)"/>
    <path d="M 1400 250 L 1200 450 H 1000" stroke="rgba(253, 224, 71, 0.2)"/>
  </g>

  <!-- Python Dual Emblem - Stylized 3D Isometric Cyber Art -->
  <g transform="translate(800, 450)" filter="url(#blurNeon)">
    <!-- Cyan Top Serpent Segment -->
    <path d="M -80 -190 C -80 -230 -40 -250 10 -250 C 60 -250 100 -230 100 -190 V -110 H -10 C -40 -110 -60 -90 -60 -60 V 0 H -110 C -150 0 -170 -40 -170 -90 C -170 -140 -150 -190 -80 -190 Z" fill="url(#cyanGrad)"/>
    <circle cx="-20" cy="-200" r="14" fill="#070914"/>
    <circle cx="-20" cy="-200" r="7" fill="#ffffff"/>

    <!-- Gold Bottom Serpent Segment -->
    <path d="M 80 190 C 80 230 40 250 -10 250 C -60 250 -100 230 -100 190 V 110 H 10 C 40 110 60 90 60 60 V 0 H 110 C 150 0 170 40 170 90 C 170 140 150 190 80 190 Z" fill="url(#goldGrad)"/>
    <circle cx="20" cy="200" r="14" fill="#070914"/>
    <circle cx="20" cy="200" r="7" fill="#ffffff"/>

    <!-- Core Holographic Rings -->
    <ellipse cx="0" cy="0" rx="280" ry="140" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3" stroke-dasharray="16 8"/>
    <ellipse cx="0" cy="0" rx="360" ry="180" fill="none" stroke="rgba(245, 158, 11, 0.35)" stroke-width="2" stroke-dasharray="8 12"/>
  </g>

  <!-- Floating Ambient Particles -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="340" cy="280" r="3"/>
    <circle cx="480" cy="620" r="4"/>
    <circle cx="620" cy="180" r="2.5"/>
    <circle cx="1250" cy="220" r="3"/>
    <circle cx="1320" cy="680" r="3.5"/>
    <circle cx="1180" cy="740" r="2"/>
  </g>
  <g fill="#fde047" opacity="0.5">
    <circle cx="280" cy="480" r="2.5"/>
    <circle cx="980" cy="150" r="3"/>
    <circle cx="1050" cy="780" r="3"/>
    <circle cx="1400" cy="420" r="2"/>
  </g>

  <!-- Vignette Overlay -->
  <rect width="1600" height="900" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
</svg>

