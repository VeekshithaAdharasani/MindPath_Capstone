<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="logicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b081a"/>
      <stop offset="50%" stop-color="#140f2e"/>
      <stop offset="100%" stop-color="#060410"/>
    </linearGradient>

    <linearGradient id="purpleVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <radialGradient id="logicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <filter id="logicNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="logicGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#logicBg)"/>
  <rect width="1600" height="900" fill="url(#logicGrid)"/>
  <circle cx="800" cy="450" r="500" fill="url(#logicGlow)"/>

  <!-- 3D Isometric Puzzle Matrix Cube -->
  <g transform="translate(800, 450)" filter="url(#logicNeon)">
    <!-- Top Face -->
    <polygon points="0,-140 120,-70 0,0 -120,-70" fill="#a855f7" opacity="0.9"/>
    <line x1="-60" y1="-105" x2="60" y2="-35" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="-105" x2="-60" y2="-35" stroke="#ffffff" stroke-width="2"/>

    <!-- Left Face -->
    <polygon points="-120,-70 0,0 0,140 -120,70" fill="#7c3aed" opacity="0.9"/>
    <line x1="-60" y1="-35" x2="-60" y2="105" stroke="#ffffff" stroke-width="2"/>
    <line x1="-120" y1="0" x2="0" y2="70" stroke="#ffffff" stroke-width="2"/>

    <!-- Right Face -->
    <polygon points="0,0 120,-70 120,70 0,140" fill="#6d28d9" opacity="0.9"/>
    <line x1="60" y1="-35" x2="60" y2="105" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="70" x2="120" y2="0" stroke="#ffffff" stroke-width="2"/>

    <!-- Glowing Orbiting Data Rings -->
    <ellipse cx="0" cy="0" rx="260" ry="90" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="16 8"/>
    <ellipse cx="0" cy="0" rx="320" ry="120" fill="none" stroke="url(#purpleVioletGrad)" stroke-width="2" stroke-dasharray="8 8"/>
  </g>

  <!-- Ambient Light Sparks -->
  <g fill="#c084fc" opacity="0.6">
    <circle cx="280" cy="220" r="3"/>
    <circle cx="450" cy="740" r="3.5"/>
    <circle cx="1250" cy="240" r="2.5"/>
    <circle cx="1380" cy="620" r="4"/>
  </g>
</svg>

