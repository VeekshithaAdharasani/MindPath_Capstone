<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="skillsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160e05"/>
      <stop offset="50%" stop-color="#241708"/>
      <stop offset="100%" stop-color="#0e0802"/>
    </linearGradient>

    <linearGradient id="amberGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <radialGradient id="skillsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <filter id="skillsNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="skillsGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#skillsBg)"/>
  <rect width="1600" height="900" fill="url(#skillsGrid)"/>
  <circle cx="800" cy="450" r="500" fill="url(#skillsGlow)"/>

  <!-- Stage Light Beams -->
  <g opacity="0.15">
    <polygon points="800,0 300,900 600,900" fill="url(#amberGoldGrad)"/>
    <polygon points="800,0 1000,900 1300,900" fill="url(#amberGoldGrad)"/>
  </g>

  <!-- Speech Wave Audio Resonance Arcs -->
  <g stroke="rgba(251, 191, 36, 0.35)" stroke-width="3" fill="none" filter="url(#skillsNeon)">
    <!-- Left Sound Waves -->
    <path d="M 650 350 A 150 150 0 0 0 650 550"/>
    <path d="M 580 300 A 220 220 0 0 0 580 600"/>
    <path d="M 510 250 A 290 290 0 0 0 510 650"/>

    <!-- Right Sound Waves -->
    <path d="M 950 350 A 150 150 0 0 1 950 550"/>
    <path d="M 1020 300 A 220 220 0 0 1 1020 600"/>
    <path d="M 1090 250 A 290 290 0 0 1 1090 650"/>
  </g>

  <!-- Center Leadership Beacon / Compass Star -->
  <g transform="translate(800, 450)" filter="url(#skillsNeon)">
    <!-- Radiating Ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" stroke-dasharray="16 8"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#fbbf24" stroke-width="3"/>

    <!-- 4-Pointed Star -->
    <path d="M 0 -130 L 22 -30 L 130 0 L 22 30 L 0 130 L -22 30 L -130 0 L -22 -30 Z" fill="url(#amberGoldGrad)"/>
    <circle cx="0" cy="0" r="18" fill="#ffffff"/>
  </g>

  <!-- Dynamic Equalizer Frequency Bars at Base -->
  <g transform="translate(620, 680)" fill="#f59e0b" opacity="0.6">
    <rect x="0" y="-30" width="12" height="30" rx="6"/>
    <rect x="25" y="-60" width="12" height="60" rx="6"/>
    <rect x="50" y="-45" width="12" height="45" rx="6"/>
    <rect x="75" y="-90" width="12" height="90" rx="6"/>
    <rect x="100" y="-120" width="12" height="120" rx="6"/>
    <rect x="125" y="-70" width="12" height="70" rx="6"/>
    <rect x="150" y="-140" width="12" height="140" rx="6"/>
    <rect x="175" y="-110" width="12" height="110" rx="6"/>
    <rect x="200" y="-160" width="12" height="160" rx="6"/>
    <rect x="225" y="-100" width="12" height="100" rx="6"/>
    <rect x="250" y="-130" width="12" height="130" rx="6"/>
    <rect x="275" y="-80" width="12" height="80" rx="6"/>
    <rect x="300" y="-115" width="12" height="115" rx="6"/>
    <rect x="325" y="-55" width="12" height="55" rx="6"/>
    <rect x="350" y="-35" width="12" height="35" rx="6"/>
  </g>

  <!-- Ambient Golden Dust Particles -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="280" cy="220" r="3"/>
    <circle cx="450" cy="740" r="3.5"/>
    <circle cx="1250" cy="240" r="2.5"/>
    <circle cx="1380" cy="620" r="4"/>
    <circle cx="720" cy="180" r="3"/>
    <circle cx="880" cy="780" r="2.5"/>
  </g>
</svg>

