<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="gkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140e06"/>
      <stop offset="50%" stop-color="#241708"/>
      <stop offset="100%" stop-color="#0a0703"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <radialGradient id="gkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <filter id="gkNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gkGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#gkBg)"/>
  <rect width="1600" height="900" fill="url(#gkGrid)"/>
  <circle cx="800" cy="450" r="500" fill="url(#gkGlow)"/>

  <!-- 3D Holographic Globe -->
  <g transform="translate(800, 450)" filter="url(#gkNeon)">
    <!-- Globe Outer Ring -->
    <circle cx="0" cy="0" r="190" fill="rgba(251, 191, 36, 0.05)" stroke="url(#amberGrad)" stroke-width="4"/>

    <!-- Latitude lines -->
    <ellipse cx="0" cy="0" rx="190" ry="60" fill="none" stroke="rgba(251, 191, 36, 0.35)" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="190" ry="120" fill="none" stroke="rgba(251, 191, 36, 0.35)" stroke-width="2"/>
    <line x1="-190" y1="0" x2="190" y2="0" stroke="url(#amberGrad)" stroke-width="2.5"/>

    <!-- Longitude lines -->
    <ellipse cx="0" cy="0" rx="60" ry="190" fill="none" stroke="rgba(251, 191, 36, 0.35)" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="120" ry="190" fill="none" stroke="rgba(251, 191, 36, 0.35)" stroke-width="2"/>
    <line x1="0" y1="-190" x2="0" y2="190" stroke="url(#amberGrad)" stroke-width="2.5"/>
  </g>

  <!-- Ambient Particles -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="280" cy="240" r="3"/>
    <circle cx="450" cy="720" r="3.5"/>
    <circle cx="1220" cy="220" r="2.5"/>
    <circle cx="1350" cy="650" r="4"/>
  </g>
</svg>

