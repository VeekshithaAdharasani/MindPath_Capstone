<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mpTopGrad" x1="18" y1="16" x2="82" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#d946ef" />
      <stop offset="45%" stopColor="#c084fc" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>
    <linearGradient id="mpTopWellGrad" x1="26" y1="23" x2="74" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#f0abfc" />
      <stop offset="50%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#581c87" />
    </linearGradient>
    <linearGradient id="mpLeftGrad" x1="18" y1="34" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#7e22ce" />
      <stop offset="40%" stopColor="#581c87" />
      <stop offset="100%" stopColor="#1e1035" />
    </linearGradient>
    <linearGradient id="mpLeftPanelGrad" x1="18" y1="40" x2="33" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#e879f9" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
    <linearGradient id="mpRightGrad" x1="50" y1="52" x2="82" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e1b4b" />
      <stop offset="50%" stopColor="#1d4ed8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="mpRightPanelGrad" x1="67" y1="40" x2="82" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="mpCyanRimGrad" x1="50" y1="88" x2="82" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
    <filter id="mpNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Isometric Face -->
  <polygon points="18,34 50,52 50,88 18,70" fill="url(#mpLeftGrad)" stroke="#3b0764" stroke-width="0.8" />
  <polygon points="19,41 33,49 33,60 19,52" fill="url(#mpLeftPanelGrad)" stroke="#f0abfc" stroke-width="0.5" opacity="0.95" />

  <!-- Right Isometric Face -->
  <polygon points="50,52 82,34 82,70 50,88" fill="url(#mpRightGrad)" stroke="#1e3a8a" stroke-width="0.8" />
  <polygon points="67,49 81,41 81,52 67,60" fill="url(#mpRightPanelGrad)" stroke="#7dd3fc" stroke-width="0.5" opacity="0.95" />

  <!-- Top Isometric Rhombus Face -->
  <polygon points="50,16 82,34 50,52 18,34" fill="url(#mpTopGrad)" stroke="#e879f9" stroke-width="0.8" />
  <polygon points="50,22 75,35 50,48 25,35" fill="url(#mpTopWellGrad)" stroke="#fdf4ff" stroke-width="0.6" />
  <polygon points="50,26 69,35 50,44 31,35" fill="#3b0764" opacity="0.5" />
  <polygon points="50,29 63,35 50,41 37,35" fill="#c084fc" opacity="0.85" />

  <!-- Neon Glowing Outlines -->
  <polyline points="50,88 82,70" stroke="url(#mpCyanRimGrad)" stroke-width="2.2" stroke-linecap="round" filter="url(#mpNeonGlow)" />
  <polyline points="50,88 18,70" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" filter="url(#mpNeonGlow)" />
  <line x1="50" y1="52" x2="50" y2="88" stroke="#38bdf8" stroke-width="1.2" opacity="0.75" />
</svg>